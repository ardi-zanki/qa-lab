<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Approval Lab</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/ui.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">QA PORTFOLIO LAB</p>
      <h1>Document Approval Lab</h1>
      <p>Create a sample request and approve it with a six-digit demo code.</p>
    </header>
    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a request</h2>
      <form id="create">
        <label for="title">Document title</label>
        <input id="title" name="title" placeholder="Example: Purchase request" maxlength="80" required>
        <label for="fixture">Test fixture</label>
        <select id="fixture" name="fixture">
          <option value="standard">Standard code</option>
          <option value="leading-zero">Code with leading zero</option>
        </select>
        <button>Create request</button>
      </form>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="request" aria-labelledby="request-heading" hidden>
      <h2 id="request-heading"></h2>
      <p id="status" role="status"></p>
      <p id="approved-at"></p>
      <form id="approve" hidden>
        <p id="code-hint"></p>
        <label for="code">Approval code</label>
        <input id="code" name="code" type="text" inputmode="numeric" maxlength="6"
               autocomplete="off" required aria-describedby="code-hint approval-error">
        <p id="approval-error" class="error" role="alert" hidden></p>
        <button>Approve document</button>
      </form>
    </section>
  </main>
</body>
</html>
