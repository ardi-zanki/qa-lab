<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Approval QA Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/ui.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">QA PORTFOLIO LAB</p>
      <h1>Document Approval QA Lab</h1>
      <p>Create a sample request and approve it with a six-digit demo code.</p>
    </header>
    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a request</h2>
      <form id="create" novalidate>
        <label for="title">Document title</label>
        <input id="title" name="title" placeholder="Example: Purchase request" required aria-describedby="title-error">
        <p id="title-error" class="error field-error" role="alert" hidden></p>
        <label for="fixture">Test fixture</label>
        <select id="fixture" name="fixture">
          <option value="standard">Standard code</option>
          <option value="leading-zero">Code with leading zero</option>
        </select>
        <button data-loading-label="Creating request..." aria-live="polite">Create request</button>
      </form>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="request" aria-labelledby="request-heading" hidden>
      <div class="request-summary">
        <h2 id="request-heading"></h2>
        <div class="status-group">
          <p id="status" role="status"></p>
          <p id="approval-attempt" aria-live="polite" hidden></p>
        </div>
      </div>
      <p id="approved-at"></p>
      <form id="approve" novalidate hidden>
        <p id="code-hint" class="code-hint"></p>
        <label for="code">Approval code</label>
        <input id="code" name="code" type="text" inputmode="numeric"
               autocomplete="off" required aria-describedby="code-hint approval-error">
        <p id="approval-error" class="error field-error" role="alert" hidden></p>
        <button data-loading-label="Approving document..." aria-live="polite">Approve document</button>
      </form>
    </section>
  </main>
</body>
</html>
